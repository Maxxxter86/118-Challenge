<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
  <meta name="theme-color" content="#0f0f0f" />
  <meta name="description" content="118 Challenge 2026 · Tracker" />
  <title>118 Challenge 2026</title>

  <!-- PWA -->
  <link rel="manifest" href="manifest.json?v=5" />
  <link rel="icon" href="icon-192.png" />

  <!-- iOS -->
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="118 Challenge" />

  <style>
    :root{
      --bg:#0f0f0f;
      --card:#151515;
      --text:#f5f5f5;
      --muted:#b7b7b7;
      --line:rgba(255,255,255,.12);
      --shadow: 0 14px 35px rgba(0,0,0,.35);
    }
    *{box-sizing:border-box}
    body{
      margin:0;
      font-family: system-ui, -apple-system, Segoe UI, Roboto, Arial;
      color:var(--text);
      background:
        radial-gradient(1200px 700px at 20% 10%, rgba(74,222,128,.12), transparent 60%),
        radial-gradient(1200px 700px at 80% 30%, rgba(251,191,36,.10), transparent 60%),
        radial-gradient(1200px 700px at 50% 90%, rgba(251,113,133,.10), transparent 60%),
        var(--bg);
      min-height:100vh;
      padding:16px;
      display:flex;
      justify-content:center;
    }
    .wrap{width:min(720px,100%)}

    /* Top bar */
    .topbar{
      display:flex;
      align-items:center;
      justify-content:space-between;
      margin-bottom:10px;
    }
    .burger{
      width:42px;height:42px;
      display:grid;place-items:center;
      border:1px solid var(--line);
      border-radius:14px;
      background:rgba(255,255,255,.04);
      cursor:pointer;
    }
    .pill{
      border:1px solid var(--line);
      border-radius:999px;
      padding:6px 10px;
      font-size:12px;
      color:var(--muted);
      background:rgba(255,255,255,.03);
    }

    /* HERO */
    .hero{
      position:relative;
      height:150px;
      border-radius:18px;
      overflow:hidden;
      border:1px solid var(--line);
      background:url("icon-512.png") center/cover no-repeat;
      box-shadow:var(--shadow);
      margin-bottom:12px;
    }
    .heroOverlay{
      position:absolute; inset:0;
      background:linear-gradient(180deg, rgba(0,0,0,.15), rgba(0,0,0,.75));
    }
    .heroContent{
      position:absolute; inset:0;
      padding:14px;
      display:flex;
      flex-direction:column;
      justify-content:flex-end;
      gap:10px;
    }
    .heroTitle{font-size:20px;font-weight:900}
    .heroSub{font-size:12px;color:rgba(255,255,255,.8)}
    .heroBar{
      height:12px;border-radius:999px;
      border:1px solid rgba(255,255,255,.2);
      background:rgba(255,255,255,.1);
      overflow:hidden;
    }
    .heroFill{
      height:100%;width:0%;
      background:linear-gradient(90deg,#4ade80,#fbbf24,#fb7185);
      transition:width .3s ease;
    }
    .heroHint{font-size:12px;color:rgba(255,255,255,.85)}

    /* Cards */
    .card{
      background:rgba(21,21,21,.85);
      border:1px solid var(--line);
      border-radius:18px;
      padding:16px;
      box-shadow:var(--shadow);
      margin-bottom:12px;
    }
    .big{display:flex;justify-content:space-between;align-items:baseline}
    .count{font-size:42px;font-weight:800}
    .count small{font-size:18px;color:var(--muted)}
    .pct{color:var(--muted)}

    .bar{
      height:14px;border-radius:999px;
      border:1px solid var(--line);
      background:rgba(255,255,255,.04);
      overflow:hidden;margin:12px 0;
    }
    .fill{
      height:100%;width:0%;
      background:linear-gradient(90deg,#4ade80,#fbbf24,#fb7185);
      transition:width .3s ease;
    }

    .row{display:grid;grid-template-columns:1fr 1fr;gap:10px}
    .mini{
      border:1px solid var(--line);
      border-radius:14px;
      padding:10px;
      background:rgba(255,255,255,.03);
    }
    .mini .label{font-size:12px;color:var(--muted)}
    .mini .value{font-size:18px;font-weight:700}

    .actions{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px;margin-top:12px}
    button{
      border:1px solid var(--line);
      background:rgba(255,255,255,.04);
      color:var(--text);
      border-radius:14px;
      padding:12px;
      font-weight:700;
      cursor:pointer;
    }
    .primary{background:rgba(74,222,128,.12)}
    .danger{background:rgba(251,113,133,.12)}
    .ghost{color:var(--muted)}

    .note{display:flex;gap:10px;margin-top:10px}
    input{
      flex:1;
      border:1px solid var(--line);
      background:rgba(0,0,0,.25);
      color:var(--text);
      border-radius:12px;
      padding:10px;
    }

    .log{margin-top:10px;border-top:1px solid var(--line);padding-top:10px}
    .log-item{display:flex;justify-content:space-between;font-size:13px;padding:6px 0}

    /* Drawer */
    .backdrop{position:fixed;inset:0;background:rgba(0,0,0,.6);display:none;z-index:10}
    .drawer{
      position:fixed;top:0;left:0;height:100%;width:280px;
      background:#0f0f0f;border-right:1px solid var(--line);
      transform:translateX(-110%);
      transition:.25s ease;
      z-index:11;padding:16px;
    }
    .drawer.show{transform:translateX(0)}
    .backdrop.show{display:block}
    .nav button{width:100%;margin-bottom:8px}

    @media(max-width:520px){
      .actions{grid-template-columns:1fr}
      .row{grid-template-columns:1fr}
    }
  </style>
</head>

<body>
<div class="wrap">

  <div class="backdrop" id="backdrop"></div>
  <aside class="drawer" id="drawer">
    <h3>☰ Menú</h3>
    <div class="nav">
      <button onclick="closeDrawer()">🏠 Dashboard</button>
      <button onclick="alert('Fase 2 😉')">⚙️ Ajustes</button>
    </div>
  </aside>

  <div class="topbar">
    <div class="burger" id="burger">☰</div>
    <div class="pill" id="todayPill">—</div>
  </div>

  <div class="hero">
    <div class="heroOverlay"></div>
    <div class="heroContent">
      <div>
        <div class="heroTitle">118 Challenge</div>
        <div class="heroSub">Laponia vs Desierto · 2026</div>
      </div>
      <div class="heroBar"><div class="heroFill" id="heroFill"></div></div>
      <div class="heroHint" id="heroHint">—</div>
    </div>
  </div>

  <div class="card">
    <div class="big">
      <div class="count"><span id="done">0</span><small>/118</small></div>
      <div class="pct" id="pct">0%</div>
    </div>

    <div class="bar"><div class="fill" id="fill"></div></div>

    <div class="row">
      <div class="mini">
        <div class="label">🎯 Objetivo mes</div>
        <div class="value" id="monthGoal">—</div>
      </div>
      <div class="mini">
        <div class="label">✅ Hechos mes</div>
        <div class="value" id="monthDone">—</div>
      </div>
    </div>

    <div class="actions">
      <button class="primary" id="plus">+1 entreno</button>
      <button class="danger" id="minus">-1</button>
      <button class="ghost" id="resetMonth">Reset mes</button>
    </div>

    <div class="note">
      <input id="note" placeholder="Nota opcional" />
      <button id="addWithNote">Añadir</button>
    </div>

    <div class="log" id="log"></div>
  </div>
</div>

<script>
  const GOAL = 118;
  const monthTargets={0:10,1:9,2:10,3:9,4:10,5:9,6:10,7:9,8:10,9:10,10:9,11:13};

  const K={
    total:"c118_total",
    month:m=>"c118_m_"+m,
    log:"c118_log"
  };

  const today=()=>new Date();
  const mIdx=()=>today().getMonth();
  const pad=n=>String(n).padStart(2,"0");
  const dateStamp=()=>`${today().getFullYear()}-${pad(today().getMonth()+1)}-${pad(today().getDate())}`;

  function init(){
    if(localStorage.getItem(K.total)==null)localStorage.setItem(K.total,2);
    if(localStorage.getItem(K.month(mIdx()))==null)localStorage.setItem(K.month(mIdx()),2);
    if(localStorage.getItem(K.log)==null)localStorage.setItem(K.log,JSON.stringify([]));
  }

  function update(){
    const done=+localStorage.getItem(K.total);
    const goal=GOAL;
    const pct=Math.round(done/goal*100);

    doneEl.textContent=done;
    pctEl.textContent=pct+"%";
    fill.style.width=pct+"%";
    heroFill.style.width=pct+"%";

    const rem=goal-done;
    heroHint.textContent=rem>0?`Faltan ${rem}`:rem==0?"¡Clavado!":`+${-rem} 🔥`;

    monthGoal.textContent=monthTargets[mIdx()];
    monthDone.textContent=localStorage.getItem(K.month(mIdx()));

    todayPill.textContent=`📅 ${pad(today().getDate())}/${pad(today().getMonth()+1)}`;

    const log=JSON.parse(localStorage.getItem(K.log));
    logEl.innerHTML=log.slice().reverse().map(l=>`<div class="log-item">${l.date} ${l.note||""}</div>`).join("");
  }

  function add(d,note=""){
    localStorage.setItem(K.total,+localStorage.getItem(K.total)+d);
    localStorage.setItem(K.month(mIdx()),+localStorage.getItem(K.month(mIdx()))+d);
    const log=JSON.parse(localStorage.getItem(K.log));
    log.push({date:dateStamp(),note});
    localStorage.setItem(K.log,JSON.stringify(log));
    update();
  }

  const doneEl=document.getElementById("done");
  const pctEl=document.getElementById("pct");
  const fill=document.getElementById("fill");
  const heroFill=document.getElementById("heroFill");
  const heroHint=document.getElementById("heroHint");
  const monthGoal=document.getElementById("monthGoal");
  const monthDone=document.getElementById("monthDone");
  const todayPill=document.getElementById("todayPill");
  const logEl=document.getElementById("log");

  plus.onclick=()=>add(1);
  minus.onclick=()=>add(-1);
  resetMonth.onclick=()=>{localStorage.setItem(K.month(mIdx()),0);update();}
  addWithNote.onclick=()=>{add(1,note.value);note.value="";}

  burger.onclick=()=>{drawer.classList.add("show");backdrop.classList.add("show")}
  backdrop.onclick=closeDrawer;
  function closeDrawer(){drawer.classList.remove("show");backdrop.classList.remove("show")}

  init(); update();

  if("serviceWorker"in navigator){
    navigator.serviceWorker.register("./sw.js?v=5");
  }
</script>
</body>
</html>
